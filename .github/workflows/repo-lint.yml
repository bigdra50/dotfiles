name: Repo Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and shfmt
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" -o shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo cp shellcheck-v0.10.0/shellcheck /usr/local/bin/
          rm -rf shellcheck.tar.xz shellcheck-v0.10.0

          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

          shellcheck --version
          shfmt --version

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/setup/*.sh scripts/reference/*.sh .claude/hooks/*.sh .claude/scripts/*.sh

      - name: shfmt
        # Scoped to real scripts; tests/fixtures hold parser input data, not code
        run: shfmt -d -i 4 -ci scripts/*.sh scripts/setup/*.sh scripts/reference/*.sh .claude/hooks/*.sh .claude/scripts/*.sh

      # The tests run setup functions against a throwaway HOME; jq and python3 ship with the runner
      - name: Test setup scripts
        run: python3 -m unittest scripts/tests/test_setup_config_merge.py

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .claude/package-lock.json

      # --ignore-scripts: fork PR は fork 側の lockfile で npm ci が走る。
      # install lifecycle script の実行を止める。現在の依存に install script を
      # 持つパッケージは無いので副作用は無い。
      - name: Install textlint
        run: npm ci --prefix .claude --no-audit --no-fund --ignore-scripts

      # hook はフェイルオープンするので、壊れていても静かに素通りする。
      # gate が生きている保証はここに置く。
      - name: Lint markdown
        run: bash scripts/md-lint.sh

  claude-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate .claude JSON configs
        run: |
          jq empty .claude/settings.json
          jq empty .claude/package.json
          # apm fails a malformed hook manifest closed, with only a warning at
          # install time, so catch it here instead.
          find .apm/hooks -name '*.json' -print0 | xargs -0 -r -n1 jq empty

  zsh-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Check zsh syntax
        run: |
          FAILED=0

          shopt -s nullglob
          for f in .config/zsh/*.zsh .config/zsh/plugins/*.zsh; do
            if ! zsh -n "$f"; then
              echo "Syntax error in $f"
              FAILED=1
            fi
          done

          for f in .config/zsh/.zshenv .config/zsh/.zshenv_local; do
            [[ -f "$f" ]] || continue
            if ! zsh -n "$f"; then
              echo "Syntax error in $f"
              FAILED=1
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

      # claude へ渡す引数の組み立てはスタブで検査できるので、zsh のあるこのジョブで回す。
      # 実物の claude で読み込み内容を見る e2e は認証が要るのでローカル専用（mise run claude-vanilla:e2e）。
      - name: Test claude-vanilla
        run: python3 -m unittest scripts/tests/test_claude_vanilla.py

  workflows-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint workflows
        # actionlint's -shellcheck flag only accepts an executable path; an
        # argument string silently disables the integration. Severity floor
        # goes through shellcheck's own SHELLCHECK_OPTS instead, matching the
        # -S warning policy of the shell job.
        env:
          SHELLCHECK_OPTS: -S warning
        run: ./actionlint

  wezterm-lua-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install stylua
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  archive="stylua-linux-x86_64.zip" ;;
            Linux-aarch64) archive="stylua-linux-aarch64.zip" ;;
            Darwin-arm64)  archive="stylua-macos-aarch64.zip" ;;
            Darwin-x86_64) archive="stylua-macos-x86_64.zip" ;;
            *) echo "Unsupported platform"; exit 1 ;;
          esac
          # Pinned to the same version as nvim-ci.yml: stylua releases change
          # default formatting, which breaks --check against committed code
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.4.1/$archive" -o stylua.zip
          unzip -o stylua.zip -d /usr/local/bin
          rm stylua.zip

      - name: Check .wezterm.lua formatting
        run: stylua --check .wezterm.lua

  path-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Lint (ruff + mypy)
        # Pinned: unpinned, a linter release lands new rules on an unrelated
        # commit and turns main red with nothing local to reproduce it against.
        # Bump deliberately and fix the new findings in that same commit.
        run: |
          pip install --quiet ruff==0.16.1 mypy==2.3.0
          ruff check scripts/lint/
          ruff format --check scripts/lint/
          mypy --strict scripts/lint/

      - name: Unit tests
        run: python -m unittest discover -s scripts/lint/tests -t scripts/lint

      - name: Check scripts/ path references
        run: python scripts/lint/check_path_refs.py

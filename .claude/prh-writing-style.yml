# bigdra50/dotfiles 文章規範の検出辞書
#
# 検出専用。textlint --fix は走らせない（expected はリライト方針のヒントであって
# 置換文字列ではない）。修正は LLM 層が文脈を見て行う。
#
# 出典: .claude/rules/writing-style.md / commit.md / pr-description.md
#
# メッセージ中に「: 」を含む場合は YAML のマッピングと解釈されるため、
# prh / expected の値は必ずダブルクォートで囲む。
version: 1
rules:
  # --- writing-style.md「ダッシュ（—）で語句を接続しない」---
  # no-ai-list-formatting は太字を伴うリスト項目しか拾わない。太字なしの
  # 「ラベル — 説明」や地の文の挿入句はここで拾う。
  - pattern: /—/
    expected: "ダッシュを使わず文を分けるか、コロンや括弧やネストで示す"
    prh: "em ダッシュ（U+2014）で語句を接続しない。「ラベル — 説明」はコロン区切りかネストした箇条書きに置き換える。"

  # --- writing-style.md「執筆時の時系列・作業経緯を本文に残さない」---
  - pattern: /(新仕様|旧仕様)/
    expected: "現時点の仕様だけを書く"
    prh: "「新仕様/旧仕様」は書き手と特定の読者しか知らない文脈。常に現時点の完成形として書き直す。"
  - pattern: /先ほど(?:作成|述べ|説明|示し|作っ)/
    expected: "対象を名前で指す"
    prh: "「先ほど〜した」は執筆時系列。対象をファイル名や節名で直接指す。"
  - pattern: /[0-9０-９]回目の(?:修正|対応|レビュー|指摘)/
    expected: "回数ではなく内容を書く"
    prh: "「N回目の〜」は作業経緯。履歴は git に委ね、本文には現状だけを書く。"
  - pattern: /(?:FB|フィードバック)対応(?:後|済)/
    expected: "対応後の内容そのものを書く"
    prh: "「FB対応後に更新」は執筆時系列。経緯を消して現時点の完成形にする。"
  - pattern: /前(?:回|述)の(?:版|バージョン)(?:から|では|と)/
    expected: "差分ではなく現状を書く"
    prh: "過去の版との差分は本文に書かず git に委ねる。"

  # --- commit.md「ローカル文脈の排除」（PR / commit 本文で特に効く）---
  - pattern: /Phase[ 　]*[0-9０-９]/
    expected: "変更の本質を述べる表現に置き換える"
    prh: "「Phase N」はローカル作業単位。マージ先を pull する全員に意味が通る表現に置き換える。"
  - pattern: /stacked[ 　]*PR/
    expected: "関連 PR を番号で示す"
    prh: "「stacked PR の M 件目」はローカル文脈。関連 PR は番号で示す。"

  # --- pr-description.md「曖昧語を避ける」---
  # 「具体例を伴わない『など』」は文脈判断なので辞書に入れず LLM 層に残す。
  - pattern: /(もろもろ|諸々)/
    expected: "具体的に列挙する"
    prh: "「もろもろ」は中身を示さない曖昧語。実際の項目を書く。"

  # --- writing-style.md「冗長な修飾語・誇張表現・定型句を避ける」---
  # 正当な用法が多い語（「総合的」「要するに」等）は誤検知を避けて入れていない。
  - pattern: /非常に/
    expected: "削るか具体的な程度を書く"
    prh: "「非常に」は中身のない強調。削っても主張は変わらないことが多い。"
  - pattern: /極めて/
    expected: "削るか具体的な程度を書く"
    prh: "「極めて」は中身のない強調。削っても主張は変わらないことが多い。"
  - pattern: /重要なのは/
    expected: "主張をそのまま書く"
    prh: "「重要なのは〜」は主張の予告。枠を外して主張を直接書く。"
  - pattern: /(?:必要)?不可欠/
    expected: "なぜ必要かを書く"
    prh: "「不可欠」は理由を示さない強調。根拠があるなら具体的に言い切る。"
  - pattern: /(包括的|多角的)/
    expected: "何を網羅したか、どう見たかを書く"
    prh: "「包括的」「多角的」は範囲や観点の中身を示さない形容。実際の内容を書くか削る。"
  - pattern: /鍵となる/
    expected: "何がどう効くかを書く"
    prh: "「鍵となる」は働きを示さない強調。働きを書くか削る。"
  - pattern: /(掘り下げ|深掘り)/
    expected: "何をどう調べるかを言う"
    prh: "「掘り下げる」「深掘り」は動作の中身を示さない動詞。実際の動作で言い換える。"
  - pattern: /に他な(?:らない|りません)/
    expected: "断定をそのまま書く"
    prh: "「〜に他ならない」は中身を足さない強調。普通の断定で書く。"
  - pattern: /見ていき(?:ましょう|ます)/
    expected: "予告を削って本題から入る"
    prh: "「〜を見ていきます」は空の予告。本題をそのまま書き始める。"

# bigdra50/dotfiles 文章規範の検出辞書
#
# 検出専用。textlint --fix は走らせない（expected はリライト方針のヒントであって
# 置換文字列ではない）。修正は LLM 層が文脈を見て行う。
#
# 指摘された語だけを別語へ差し替えると、同じ問題が別の語形で残る。
# 「非常に速い」を「かなり速い」にしても中身のない強調は消えていない。
# 指摘は該当文を丸ごと書き直す合図として扱う。prh のメッセージには
# 「こう書く: 」で書き換え後の形を添えてあるので、その形へ文ごと寄せる。
#
# 出典: .claude/rules/writing-style.md / commit.md / pr-description.md
#
# メッセージ中に「: 」を含む場合は YAML のマッピングと解釈されるため、
# prh / expected の値は必ずダブルクォートで囲む。
#
# ここに入れるのは、このリポジトリと手元の技術ノート（md 150 ファイル）で
# 実測して誤検知が出なかったパターンだけ。判断が要るものは severity warning の
# prh-business.yml へ置く。
version: 1
rules:
  # --- writing-style.md「ダッシュ（—）で語句を接続しない」---
  # no-ai-list-formatting は太字を伴うリスト項目しか拾わない。太字なしの
  # 「ラベル — 説明」や地の文の挿入句はここで拾う。
  - pattern: /—/
    expected: "コロンかネストで関係を示すか、文を分ける"
    prh: "em ダッシュ（U+2014）で語句を接続しない。こう書く: 「ラベル: 説明」とコロンで区切るか、親項目にラベル・子項目に説明を置いたネストの箇条書きにする。"

  # --- writing-style.md「執筆時の時系列・作業経緯を本文に残さない」---
  - pattern: /(新仕様|旧仕様)/
    expected: "現時点の仕様だけを書く"
    prh: "「新仕様/旧仕様」は書き手と特定の読者しか知らない文脈。こう書く: 「認証は OIDC で行う」と現時点の姿だけを述べる。"
  - pattern: /先ほど(?:作成|述べ|説明|示し|作っ)/
    expected: "対象を名前で指す"
    prh: "「先ほど〜した」は執筆時系列。こう書く: 「scripts/md-lint.sh は」とファイル名や節名で直接指す。"
  - pattern: /[0-9０-９]回目の(?:修正|対応|レビュー|指摘)/
    expected: "回数ではなく内容を書く"
    prh: "「N回目の〜」は作業経緯。こう書く: 「タイムアウトを 5 秒へ変えた」と内容だけを書き、履歴は git に委ねる。"
  - pattern: /(?:FB|フィードバック)対応(?:後|済)/
    expected: "対応後の内容そのものを書く"
    prh: "「FB対応後に更新」は執筆時系列。こう書く: 指摘を反映した後の仕様をそのまま述べる。"
  - pattern: /前(?:回|述)の(?:版|バージョン)(?:から|では|と)/
    expected: "差分ではなく現状を書く"
    prh: "過去の版との差分は本文に書かず git に委ねる。こう書く: 「現在は起動時に一度だけ読む」と現状を述べる。"

  # --- commit.md「ローカル文脈の排除」（PR / commit 本文で特に効く）---
  - pattern: /Phase[ 　]*[0-9０-９]/
    expected: "その作業の中身で呼ぶ"
    prh: "「Phase N」はローカル作業単位。こう書く: 「認証フローを OIDC へ移す」と変更の中身で呼ぶ。"
  - pattern: /stacked[ 　]*PR/
    expected: "関連 PR を番号で示す"
    prh: "「stacked PR の M 件目」はローカル文脈。こう書く: 「親 PR: (番号)」と番号で関係を示す。"

  # --- pr-description.md「曖昧語を避ける」---
  # 「具体例を伴わない『など』」は文脈判断なので辞書に入れず LLM 層に残す。
  - pattern: /(もろもろ|諸々)/
    expected: "具体的に列挙する"
    prh: "「もろもろ」は中身を示さない曖昧語。こう書く: 「タイムアウト・リトライ回数・ログ出力先」と実際の項目を並べる。"

  # --- writing-style.md「冗長な修飾語・誇張表現・定型句を避ける」---
  # 正当な用法が多い語（「総合的」「要するに」等）は誤検知を避けて入れていない。
  - pattern: /非常に/
    expected: "程度を数値か事実で書く"
    prh: "「非常に」は中身のない強調。こう書く: 「応答に 3 秒かかる」と数値や事実で程度を示す。"
  - pattern: /極めて/
    expected: "程度を数値か事実で書く"
    prh: "「極めて」は中身のない強調。こう書く: 「既定の実装より 10 倍遅い」と比較で示す。"
  - pattern: /重要なのは/
    expected: "主張をそのまま書く"
    prh: "「重要なのは〜」は主張の予告。こう書く: 枠を外して「設定の正本は .textlintrc.json にある」と主張から書き始める。"
  - pattern: /(?:必要)?不可欠/
    expected: "なぜ必要かを書く"
    prh: "「不可欠」は理由を示さない強調。こう書く: 「これが無いと hook が黙って素通りする」と欠けたとき何が起きるかを書く。"
  - pattern: /(包括的|多角的)/
    expected: "何を網羅したか、どう見たかを書く"
    prh: "「包括的」「多角的」は範囲や観点の中身を示さない形容。こう書く: 「API・CLI・設定ファイルの 3 経路を見た」と範囲を列挙する。"
  - pattern: /鍵となる/
    expected: "何がどう効くかを書く"
    prh: "「鍵となる」は働きを示さない強調。こう書く: 「この設定が再接続の間隔を決める」と働きを述べる。"
  - pattern: /(掘り下げ|深掘り)/
    expected: "何をどう調べるかを言う"
    prh: "「掘り下げる」「深掘り」は動作の中身を示さない動詞。こう書く: 「ログを 1 行ずつ突き合わせる」と実際の動作を書く。"
  - pattern: /に他な(?:らない|りません)/
    expected: "断定をそのまま書く"
    prh: "「〜に他ならない」は中身を足さない強調。こう書く: 「これは設定ミスである」と普通の断定にする。"
  - pattern: /見ていき(?:ましょう|ます)/
    expected: "本題そのものから書き始める"
    prh: "「〜を見ていきます」は空の予告。こう書く: 「まず ZDOTDIR を設定する」と本題から始める。"

  # --- LLM 特有の空語（元記事「AI の変な日本語」からの推定実装）---
  # 元記事そのものは参照できていない。仕様の要約から起こした推定実装であり、
  # 採否はこのリポジトリと手元の技術ノート（md 150 ファイル）での実測で決めた。
  # ここに置いたのは実測 0 件、すなわち人が書いた文では出てこなかった語だけ。
  #
  # 入れなかったもの（実測の記録。再提案されたら、まずこの結果を疑うこと）:
  #   「〜することができる」「〜することが可能」
  #     preset-ja-technical-writing の ja-no-redundant-expression が既に
  #     dict1 / dict2 として検出する。足すと同じ箇所を二重に報告する。
  #   「効く」（実測 37 件）「ではなく」（実測 101 件）
  #     すべて正当な用法だった。判断が要るので prh-business.yml へ回した。
  - pattern: /シームレス/
    expected: "何がどう繋がるかを書く"
    prh: "「シームレス」は売り文句で、接続の実態を示さない。こう書く: 「再ログインなしで別タブへ移れる」と具体的な動きを書く。"
  - pattern: /一般的に/
    expected: "誰がそう言うのか、根拠を書く"
    prh: "「一般的に」は出所のない一般化。こう書く: 「POSIX では〜と定めている」と根拠を示すか、断定に変える。"
  - pattern: /効率的に/
    expected: "何がどれだけ速く（軽く）なるかを書く"
    prh: "「効率的に」は改善の中身を示さない副詞。こう書く: 「1 回の走査で済む」と実際の効き方を書く。"
  - pattern: /と(?:言|い)える(?:でしょう|であろう)/
    expected: "断定するか、断定できない理由を書く"
    prh: "「〜と言えるでしょう」は責任を回避した推量。こう書く: 「この構成で足りる」と断定するか、確かめていない点を明示する。"
  - pattern: /(?:ではない|ではありません)でしょうか/
    expected: "主張として書く"
    prh: "「〜ではないでしょうか」は問いかけの形をした主張。こう書く: 「この方式のほうが速い」と主張として書く。"

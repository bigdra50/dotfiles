# 判断が要る語の辞書（severity: warning）
#
# .textlintrc.json から 2 つ目の prh インスタンスとして読み込む。warning なので
# textlint は exit 0 を返し、CI も PR も落ちない。ただし Write|Edit の hook は
# 出力の有無で差し戻すため、書いた直後のモデルには届く。
# 「機械には黒と断定できないが、書き手には見直してほしい」語をここに置く。
#
# 元記事「AI の変な日本語を Hooks で検査する」からの推定実装。元記事そのものは
# 参照できていないので、仕様の要約から起こした推定である。名指しされた語を
# そのまま採るのではなく、このリポジトリと手元の技術ノート（md 150 ファイル）へ
# 当てて件数を数え、誤検知の割合で error / warning / 不採用を振り分けた。
#
# 検出専用。--fix は走らせない（expected はリライト方針のヒント）。
# 指摘された語だけを差し替えても同じ問題が別の語形で残る。該当文を丸ごと書き直す。
#
# 実測して「入れない」と決めたもの:
#   /効く/        37 件。「resume-recenter が効く」「画素数は制御レートに効く」など、
#                 全件が「作用する」の正当な用法だった。誤検知率 100% のルールは
#                 warning でも鳴りっぱなしになるので、語そのものは採らず、
#                 LLM 特有の言い回し（効いてくる）だけに絞った。
#   /ではなく/    101 件。「実装ではなく振る舞いをテストする」のように、対比が
#                 情報を足している文がほとんどだった。「不要な否定対比」かどうかは
#                 正規表現で判定できないので、定型の枠（単なる〜ではなく、
#                 〜ではなくむしろ）だけを採った。
version: 1
rules:
  # 実測 1 件（技術ノートの「index を必要に応じて書き換える」）。
  - pattern: /必要に応じて/
    expected: "どの条件のときに何をするかを書く"
    prh: "「必要に応じて」は条件を読み手に丸投げしている。こう書く: 「カメラの認識順が入れ替わったら index を書き換える」と条件を明示する。"

  # 実測 1 件（.claude/rules/unity/csharp.md の「CancellationToken を適切に伝播」）。
  - pattern: /適切に/
    expected: "何をもって適切とするかを書く"
    prh: "「適切に」は基準を示さない副詞。こう書く: 「呼び出し先へそのまま渡す」と守るべき形を書く。"

  # 実測 1 件（技術ノートの「lru_cache を活用して」）。「活用パターン」「活用先」
  # のような名詞用法は正当なので、動詞の形だけを見る。
  - pattern: /活用(?:する|して|した|します)/
    expected: "どう使うかを書く"
    prh: "「活用する」は使い方をぼかす動詞。こう書く: 「lru_cache でメモ化する」と実際の使い方を書く。"

  # 実測 0 件。仮説の列挙（原因は 2 つ考えられる）は正当な用法なので warning に留める。
  - pattern: /考えられ(?:る|ます|ない)/
    expected: "誰がそう見るのか、根拠は何かを書く"
    prh: "「考えられる」は主体と根拠を隠す。こう書く: 「ログの欠落から見て、原因は再接続の失敗だ」と根拠つきで書く。"

  # 実測 0 件。/効く/ 単体は誤検知だらけなので、効果を予告するだけの言い回しに絞る。
  - pattern: /効い(?:てくる|てきま)/
    expected: "何にどう効くかを書く"
    prh: "「効いてくる」は効果を予告するだけで中身が無い。こう書く: 「真価は再接続時にある」「本領を発揮するのは 100 台を超えてから」と、効く場面を名指しする。"

  # 実測 0 件。/ではなく/ 単体は 101 件が正当だったため、否定対比の定型枠だけを見る。
  - pattern: /(?:単なる|ただの|単に)[^。]{0,24}ではなく/
    expected: "主張だけを肯定形で書く"
    prh: "「単なる〜ではなく」は誰も言っていない見方を否定してから主張する型。こう書く: 否定を消して「この層は検出だけを担う」と主張だけ書く。"
  - pattern: /ではなく、?[ 　]*(?:むしろ|まさに)/
    expected: "対比をやめて主張を直接書く"
    prh: "「〜ではなくむしろ〜」は対比が情報を足していれば正当、そうでなければ水増し。こう書く: 足していないなら後半だけを残す。"

# apm (Microsoft Agent Package Manager) manifest — global agent primitives.
# Source of truth for `apm install -g` (deploys skills + agents across the
# harnesses listed in `targets`: claude/codex/copilot/cursor).
# 各エントリは <owner/repo>/<path> のサブパス指定。path は SKILL.md を持つスキル
# フォルダか、plugin manifest を持つカテゴリ (bundle) を指す。
# 追加/削除はこのファイルを編集して `mise run setup:claude` で反映する。
#
# 更新は `apm update -g --dry-run` で plan を読んでから、引数なしの `apm update -g`。
# --yes は付けないこと。既定 No のプロンプトが SHA/tag 書き換えを見せる唯一の関門で、
# 潰すと pin が黙って動く。特定の依存だけ更新するなら `apm update -g <pkg>...`。
# 他マシンでの再現は `apm install -g --frozen` (lockfile 固定・drift で fail)。
name: bigdra-skills
version: 1.0.0
description: Global agent primitives (skills + agents) managed by apm
# 各 target のユーザスコープへ配置する。rules のクロスツール配布は apm では
# 部分対応のため、従来どおり scripts/sync-rules.sh に委ねる（apm 対象外）。
targets:
  - claude
  - codex
  - copilot
  - cursor
dependencies:
  apm:
    # カテゴリ直下を指すものは plugin bundle。配下の全スキルが 1 エントリで入る
    # (claude-code=6 / github=3 / unity=22)。絞りたい場合は
    # bigdra50/skills/<category>/<skill> の個別指定も従来どおり使える。
    - bigdra50/skills/3dcg/blender-export
    - bigdra50/skills/3dcg/blender-inspect
    - bigdra50/skills/claude-code
    - bigdra50/skills/design/design-mockup
    - bigdra50/skills/design/drawio
    - bigdra50/skills/docs/docs-architect
    - bigdra50/skills/docs/html-reports
    - bigdra50/skills/docs/html-reports-arch
    - bigdra50/skills/docs/japanese-tech-writing
    - bigdra50/skills/docs/sync-docs
    - bigdra50/skills/even/evenhub-upload
    - bigdra50/skills/github
    - bigdra50/skills/research/x-research
    - bigdra50/skills/review/google-code-review
    - bigdra50/skills/review/second-opinion
    - bigdra50/skills/system/disk-usage
    - bigdra50/skills/unity
    # 9 スキルを持つ apm パッケージなので、これ 1 行で全部入る。
    # スキルが読む内容リポジトリ (survey-any) は private かつ apm パッケージ構造を
    # 持たないため、ここには載らない。install は通るが、ghq で survey-any を
    # clone していないマシンでは実行時に解決に失敗する。
    - bigdra50/survey-any-tools
    - bigdra50/unilyze/src/Unilyze/Skills/quality-audit
    - bigdra50/unilyze/src/Unilyze/Skills/refactor-loop
    # grill-me の本文は "Run a /grilling session." の 1 行なので、grilling が
    # 無いと動かない。片方だけ消さないこと。
    # 自リポジトリと違い上流の更新は制御できないため #sha で pin する。
    #
    # この 2 件だけは `apm update` に任せられない。update は #sha pin を「最新の
    # annotated tag が指す commit」へ移すが、上流はタグが main より 42 コミット
    # 遅れているため、更新すると依存が巻き戻る。同じ理由で `apm outdated -g` は
    # この 2 件を常に outdated と報告する (pin の方が新しい)。追従は上流 main を
    # 直接見て、この pin を手で書き換える。
    - mattpocock/skills/skills/productivity/grilling#2ab958093e83e0ec752e6c1c5932da465bf23e0c
    - mattpocock/skills/skills/productivity/grill-me#2ab958093e83e0ec752e6c1c5932da465bf23e0c
    - mizchi/skills/devops/actions-ci-tuning
    - mizchi/skills/devops/gh-fix-ci
    - mizchi/skills/meta/empirical-prompt-tuning
    - mizchi/skills/meta/tech-article-reproducibility
    # マシン固有のスキルはこの正本に載せない。ただし apm は manifest に無い配置
    # ファイルを install 時に削除するため、管理外で残したいものは ~/.claude/skills
    # へ直接置くこと (apm は "local files not managed by APM" として skip する)。
  mcp: []
includes: auto
scripts: {}
